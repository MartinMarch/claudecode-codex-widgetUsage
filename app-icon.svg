<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Agent Gauge icon: the Claude critter and the Codex critter on smoked glass.
       Same 16×16 pixel drawings as src/critters.ts, scaled ×26. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3560"/>
      <stop offset="0.55" stop-color="#161c30"/>
      <stop offset="1" stop-color="#3a2340"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="haloC"><stop offset="0" stop-color="#ff8f70" stop-opacity="0.45"/><stop offset="1" stop-color="#ff8f70" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloX"><stop offset="0" stop-color="#5cc8ff" stop-opacity="0.45"/><stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/></radialGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#glass)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#rim)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="214.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <circle cx="278" cy="530" r="228" fill="url(#haloC)"/>
  <circle cx="746" cy="530" r="228" fill="url(#haloX)"/>

  <!-- Claude critter (left) -->
  <g shape-rendering="crispEdges" transform="translate(70 318) scale(26)">
    <g fill="#ff8f70">
      <rect x="3" y="4" width="10" height="7"/><rect x="1" y="6" width="2" height="2"/><rect x="13" y="6" width="2" height="2"/>
      <rect x="4" y="11" width="1" height="3"/><rect x="6" y="11" width="1" height="3"/>
      <rect x="9" y="11" width="1" height="3"/><rect x="11" y="11" width="1" height="3"/>
    </g>
    <g fill="#20140f"><rect x="5" y="6" width="1" height="2"/><rect x="10" y="6" width="1" height="2"/></g>
  </g>

  <!-- Codex critter (right) -->
  <g shape-rendering="crispEdges" transform="translate(538 318) scale(26)">
    <g fill="#5cc8ff">
      <rect x="4" y="3" width="8" height="1"/><rect x="3" y="4" width="10" height="7"/>
      <rect x="2" y="6" width="1" height="4"/><rect x="13" y="6" width="1" height="4"/>
      <rect x="5" y="11" width="2" height="2"/><rect x="9" y="11" width="2" height="2"/>
    </g>
    <g fill="#0d1a24">
      <rect x="5" y="6" width="1" height="1"/><rect x="6" y="7" width="1" height="1"/><rect x="5" y="8" width="1" height="1"/>
      <rect x="8" y="8" width="3" height="1"/>
    </g>
  </g>
</svg>

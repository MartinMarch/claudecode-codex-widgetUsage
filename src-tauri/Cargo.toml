[package]
name = "agent-gauge"
version = "0.1.0"
description = "Glass desktop widget showing Claude Code and Codex usage and running sessions"
edition = "2021"

[lib]
name = "agent_gauge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
window-vibrancy = "0.6"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
